name: PinID baseline
on:
  push:
    branches: [pinid]
  pull_request:
permissions:
  contents: read
jobs:
  pinid:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: PinID
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: PinID/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:coverage
  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: pinid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pinid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: PinID
    env:
      PINID_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/pinid_test
      PINID_PG_TEST_ALLOW_RESET: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: PinID/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:coverage
