name: PinID baseline
on:
  push:
    branches: [pinid]
  pull_request:
permissions:
  contents: read
jobs:
  pinid:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: PinID
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: PinID/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:coverage
