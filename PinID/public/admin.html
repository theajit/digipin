<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PinID administrator | Pin Code Café</title><link rel="stylesheet" href="/style.css"><script src="/admin.js" defer></script></head><body><main><a href="/">PinID · Pin Code Café</a><h1>Invitation desk</h1><p id="message" role="status"></p><form id="login" method="post"><label>Administrator credential<input name="credential" type="password" autocomplete="off" required maxlength="43"></label><button type="submit" disabled>Open invitation desk</button></form><section id="desk" hidden><button id="logout" type="button">Sign out</button><button id="invite" type="button">Create invitation</button><button id="refresh" type="button">Refresh queue</button><section id="token" hidden class="notice"><h2>Deliver this token privately</h2><p>Shown once here; expires in 48 hours and can be redeemed once. Approval does not reserve a username. Do not put this token in a URL.</p><code id="invitation"></code><button id="hide-token" type="button">I have saved the invitation</button></section><h2>Interest queue</h2><div id="queue"></div><button id="older" type="button">Load older requests</button></section></main></body></html>
